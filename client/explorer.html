<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Explorer · BEAM</title><link rel="icon" href="/favicon.svg"><link rel="stylesheet" href="/style.css"><meta name="description" content="Every BEAM round and every signed packet, live.">
<style>.tabs{display:flex;gap:8px;margin:26px 0 16px}.tabs button{height:36px;padding:0 16px;border-radius:999px;border:1px solid var(--rule2);background:none;font-size:13.5px}.tabs button.on{background:var(--ink);color:var(--bg)}
.det{background:var(--paper);border:1px solid var(--rule);padding:18px;margin-top:16px;font:12.5px/1.7 var(--mono);word-break:break-all;display:none}.det.on{display:block}</style></head><body>
<main class="wrap"><section class="pageh"><div class="eyebrow"><i></i>Explorer</div><h1 class="h2">Every round. <span class="it">Every signature.</span></h1><p>Rounds are hash-linked: each one commits to the previous round, the agreed prices and every validator's signed submission. Packets are what tunnels carry to Robinhood Chain.</p></section>
<div class="stats"><div class="stat"><div class="l"><span class="dot"></span>&nbsp; Head round</div><div class="v" id="e1">—</div></div><div class="stat"><div class="l">Round time</div><div class="v" id="e2">—</div></div><div class="stat"><div class="l">Tunnels</div><div class="v" id="e3">—</div></div><div class="stat"><div class="l">Packets</div><div class="v" id="e4">—</div></div></div>
<div class="tabs"><button id="t1" class="on" onclick="tab(1)">Rounds</button><button id="t2" onclick="tab(2)">Packets</button></div>
<div class="card"><table class="tbl" id="tb"></table></div><div class="det" id="det"></div></main>
<script src="/app.js"></script><script>chrome('/explorer');
let T = 1; function tab(n) { T = n; $('t1').classList.toggle('on', n === 1); $('t2').classList.toggle('on', n === 2); $('det').classList.remove('on'); load(); }
async function showRound(n) { const r = await api('/api/round/' + n); $('det').classList.add('on'); $('det').innerHTML = r.error ? r.error : `<b>Round #${r.n}</b><br>hash ${r.hash}<br>prev ${r.prev}<br>time ${new Date(r.ts * 1000).toLocaleString()} · ${r.signals} signals · power ${r.power.toLocaleString()} / ${r.total.toLocaleString()}<br><br>${r.subs.map((s) => `<b>${s.name}</b> ${s.address}<br><span class="dim">sig ${s.sig}</span>`).join('<br>')}`; $('det').scrollIntoView({ behavior: 'smooth', block: 'nearest' }); }
async function load() { const st = await api('/api/status'); $('e1').textContent = '#' + st.round.toLocaleString(); $('e2').textContent = st.roundMs / 1000 + 's'; $('e3').textContent = st.tunnels; $('e4').textContent = st.packets.toLocaleString();
  if (T === 1) { const d = await api('/api/rounds?limit=40'); $('tb').innerHTML = '<thead><tr><th>Round</th><th>Hash</th><th class="r">Signals</th><th class="r hm">Validators</th><th class="r hm">Power</th><th class="r">Time</th></tr></thead><tbody>' + d.rounds.map((r) => `<tr style="cursor:pointer" onclick="showRound(${r.n})"><td class="mono"><b>#${r.n}</b></td><td class="mono dim">${r.hash.slice(0, 18)}…</td><td class="r num">${r.signals}</td><td class="r num hm">${r.validators}</td><td class="r num hm">${(r.power / r.total * 100).toFixed(1)}%</td><td class="r dim">${ago(r.ts)}</td></tr>`).join('') + '</tbody>'; }
  else { const d = await api('/api/packets?limit=40'); $('tb').innerHTML = '<thead><tr><th>Packet</th><th class="hm">Hash</th><th class="r">Prices</th><th class="r hm">Signatures</th><th class="hm">Trigger</th><th>Status</th><th class="r">Time</th></tr></thead><tbody>' + d.packets.map((p) => `<tr style="cursor:pointer" onclick="location='/verify?t=${p.tunnelId}&s=${p.seq}'"><td class="mono"><b>T${p.tunnelId} · #${p.seq}</b></td><td class="mono dim hm">${p.hash.slice(0, 18)}…</td><td class="r num">${p.ids.length}</td><td class="r num hm">${p.sigs.length}</td><td class="hm"><span class="tag">${p.trigger}</span></td><td><span class="tag ${p.status === 'relayed' ? 'ok' : p.status === 'failed' ? 'bad' : 'vio'}">${p.status}</span>${p.tx ? ` <a class="mono dim" style="font-size:11px" target="_blank" href="${st.explorer}/tx/${p.tx}">tx ↗</a>` : ''}</td><td class="r dim">${ago(p.ts)}</td></tr>`).join('') + '</tbody>'; } }
load(); setInterval(load, 10000);
</script></body></html>
