<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Oracle price feeds · BEAM</title><link rel="icon" href="/favicon.svg"><link rel="stylesheet" href="/style.css"><meta name="description" content="Every BEAM price feed: crypto, US equities, FX and commodities, agreed by the validator set every round.">
<style>.filters{display:flex;gap:8px;flex-wrap:wrap;margin:26px 0 16px;align-items:center}.filters button{height:36px;padding:0 15px;border-radius:999px;border:1px solid var(--rule2);background:none;font-size:13.5px;color:var(--ink2)}.filters button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.filters .in{max-width:260px;height:36px;margin-left:auto;border-radius:999px}</style></head><body>
<main class="wrap"><section class="pageh"><div class="eyebrow"><i></i>Oracle price feeds</div><h1 class="h2">Every feed, <span class="it">live.</span></h1><p>Each oracle price is the stake-weighted median of what every validator saw this round. Click any feed for its chart, the per-validator submissions and the raw exchange quotes behind it.</p></section>
<div class="filters" id="fl"></div>
<div class="card"><table class="tbl"><thead><tr><th>Feed</th><th class="hm">Class</th><th class="r">Price</th><th class="r">24h</th><th class="r hm">Spread</th><th class="r hm">Validators</th><th class="r hm">Updated</th><th class="r hm">Last 6h</th></tr></thead><tbody id="ft"></tbody></table></div></main>
<script src="/app.js"></script><script>chrome('/feeds');
let F = [], CL = 'all', Q = '', NV = 9;
function render() { $('fl').innerHTML = [['all', 'All'], ['crypto', 'Crypto'], ['equity', 'US equities'], ['fx', 'FX'], ['commodity', 'Commodities'], ['script', 'Oracle scripts']].map(([k, l]) => `<button class="${CL === k ? 'on' : ''}" onclick="CL='${k}';render()">${l} <span class="dim">${k === 'all' ? F.length : F.filter((x) => x.cls === k).length}</span></button>`).join('') + `<input class="in" id="q" placeholder="Search" value="${esc(Q)}" oninput="Q=this.value;rows()">`; rows(); }
function rows() { const q = Q.toLowerCase(); $('ft').innerHTML = F.filter((x) => (CL === 'all' || x.cls === CL) && (!q || (x.sym + x.name + x.id).toLowerCase().includes(q))).map((x) => `<tr onclick="location='/feed?id=${encodeURIComponent(x.id)}'" style="cursor:pointer"><td><b>${x.sym}</b> <span class="dim">${esc(x.name)}</span><div class="mono dim" style="font-size:11px">${x.id}</div></td><td class="hm"><span class="tag">${CLS[x.cls]}</span></td><td class="r num">${x.price == null ? '—' : x.cls === 'script' ? fp(x.price) + ' <span class="dim">' + esc(x.unit || '') + '</span>' : '$' + fp(x.price)}</td><td class="r num ${x.chg >= 0 ? 'up' : 'dn'}">${fpct(x.chg)}</td><td class="r num hm">${x.spread == null ? '—' : x.spread.toFixed(1) + ' bps'}</td><td class="r num hm">${x.n}/${NV}</td><td class="r hm dim">${x.ts ? ago(x.ts) : '—'}</td><td class="r hm">${sparkSvg(x.spark, 110, 30)}</td></tr>`).join(''); }
async function load() { const [f, st] = await Promise.all([api('/api/feeds'), api('/api/status')]); F = f.feeds; NV = st.validators; if (!$('fl').innerHTML) render(); else rows(); }
load(); setInterval(load, 10000);
</script></body></html>
